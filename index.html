<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="/files/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="/files/favicon.svg" />
  <link rel="icon" type="image/png" sizes="16x16" href="/files/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/files/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/files/favicon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/files/favicon-512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/files/favicon-180.png" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <title>Balbali Store</title>
</head>
<body>
  <div id="root"></div>
  <script>
    window.addEventListener('error', function (e) {
      alert('GLOBAL ERROR: ' + e.message + '\n\n' + (e.error && e.error.stack ? e.error.stack : '(no stack)'));
    });
    window.addEventListener('unhandledrejection', function (e) {
      alert('UNHANDLED PROMISE REJECTION: ' + (e.reason && (e.reason.message || e.reason)));
    });
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
